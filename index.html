<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Garmin SRF Vehicle Icon Generator | Bird's-Eye Car to SRF</title>
  <meta name="description" content="Convert any top-down or bird's-eye car photo into a custom Garmin GPS .srf vehicle icon. Free, open-source, and runs 100% in your browser." />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --secondary: #334155;
      --secondary-hover: #475569;
      --green: #22c55e;
      --amber: #f59e0b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .embed-wrapper {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.25rem, 2.5vw, 1.65rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(290px, 360px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-width: 0;
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      color: #f1f5f9;
    }

    /* Vehicle Identity (Color / Make / Model) */
    .vehicle-id-box {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .vehicle-id-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    @media (max-width: 460px) {
      .vehicle-id-grid {
        grid-template-columns: 1fr;
      }
    }

    .mini-field label {
      display: block;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .mini-field input {
      width: 100%;
      padding: 7px 9px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
    }

    .mini-field input:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    .filename-preview {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
